# One-shot pod to import images into node containerd (single-node cluster, no registry).
# Not part of the Helm chart — apply manually or via scripts/sideload/.
#
# Override node with: sed "s/nodeName: .*/nodeName: YOUR_NODE/" before kubectl apply
apiVersion: v1
kind: Pod
metadata:
  name: virtfoundry-image-import
  namespace: virtfoundry-system
  labels:
    app: virtfoundry-image-import
spec:
  nodeName: REPLACE_NODE_NAME
  restartPolicy: Never
  hostPID: true
  containers:
    - name: import
      image: alpine:3.20
      command: ["sleep", "7200"]
      securityContext:
        privileged: true
      volumeMounts:
        - name: host
          mountPath: /host
        - name: import
          mountPath: /import
  volumes:
    - name: host
      hostPath:
        path: /
        type: Directory
    - name: import
      emptyDir:
        sizeLimit: 2Gi
