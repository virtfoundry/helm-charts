---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: vksclusters.virtfoundry.io
spec:
  group: virtfoundry.io
  names:
    kind: VKSCluster
    listKind: VKSClusterList
    plural: vksclusters
    shortNames:
    - vksc
    singular: vkscluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.kubernetesVersion
      name: Version
      type: string
    - jsonPath: .status.controlPlaneEndpoint
      name: Endpoint
      type: string
    - jsonPath: .status.readyWorkers
      name: Workers
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: VKSCluster is a managed Kubernetes cluster (Kamaji CP + VirtFoundry
          worker VMs).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of VKSCluster
            properties:
              controlPlane:
                description: ControlPlane hosts the Kamaji TCP settings.
                properties:
                  address:
                    description: |-
                      Address advertised on the TCP.
                      NodePort: node InternalIP (empty = controller --node-address).
                      LoadBalancer: omit; operator fills from Service status.loadBalancer.ingress.
                    type: string
                  addressPool:
                    description: |-
                      AddressPool is a MetalLB IPAddressPool name for LoadBalancer CPs
                      (annotation metallb.universe.tf/address-pool). Overrides the controller
                      --load-balancer-address-pool flag. Empty = flag, then cluster autoAssign.
                    type: string
                  port:
                    description: |-
                      Port for the API Service.
                      LoadBalancer default 443; NodePort default 30443 (must be 30000–32767).
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  serviceType:
                    default: LoadBalancer
                    description: |-
                      ServiceType for the TCP API Service.
                      LoadBalancer (default): VIP from cluster LB (MetalLB autoAssign when unset — no pool pin).
                      NodePort: lab/dev; requires address (spec or --node-address).
                    enum:
                    - LoadBalancer
                    - NodePort
                    type: string
                type: object
              kubernetesVersion:
                description: KubernetesVersion for the TenantControlPlane (e.g. v1.36.5).
                pattern: ^v?1\.(3[1-9]|[4-9][0-9])\.[0-9]+$
                type: string
              workers:
                description: Workers are VirtFoundry Instances that join the tenant
                  cluster.
                properties:
                  count:
                    default: 1
                    description: 'Count of worker Instances to create (MVP: 1–3).'
                    format: int32
                    maximum: 3
                    minimum: 1
                    type: integer
                  networkRef:
                    description: NetworkRef names the VirtFoundry Network (Multus
                      NAD).
                    properties:
                      name:
                        description: Name of the referent.
                        type: string
                    required:
                    - name
                    type: object
                  offeringRef:
                    description: OfferingRef names the VirtFoundry Offering (CPU/RAM).
                    properties:
                      name:
                        description: Name of the referent.
                        type: string
                    required:
                    - name
                    type: object
                  sshKeyRefs:
                    description: SSHKeyRefs are injected into worker cloud-init (and
                      merge with join userdata).
                    items:
                      description: LocalObjectRef names an object in the same namespace
                        (or cluster-scoped catalog).
                      properties:
                        name:
                          description: Name of the referent.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                  templateRef:
                    description: TemplateRef names the VirtFoundry Template (containerDisk
                      node image).
                    properties:
                      name:
                        description: Name of the referent.
                        type: string
                    required:
                    - name
                    type: object
                required:
                - count
                - networkRef
                - offeringRef
                - templateRef
                type: object
            required:
            - kubernetesVersion
            - workers
            type: object
          status:
            description: status defines the observed state of VKSCluster
            properties:
              conditions:
                description: conditions represent the current state of the VKSCluster
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              controlPlaneEndpoint:
                description: ControlPlaneEndpoint is host:port for the tenant API.
                type: string
              kubeconfigSecretRef:
                description: KubeconfigSecretRef is the Secret (same namespace) with
                  admin kubeconfig key admin.conf.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation last processed by
                  the controller.
                format: int64
                type: integer
              phase:
                description: Phase is a high-level lifecycle marker.
                enum:
                - Pending
                - Provisioning
                - ControlPlaneReady
                - Ready
                - Failed
                - Deleting
                type: string
              readyWorkers:
                description: ReadyWorkers is how many workers report Ready in the
                  tenant cluster.
                format: int32
                type: integer
              tcpName:
                description: TCPName is the TenantControlPlane name.
                type: string
              tcpNamespace:
                description: TCPNamespace is the host namespace of the TenantControlPlane.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
