apiVersion: v2
name: virtfoundry-platform
description: VirtFoundry platform in one release — operator, core (API + UI) and optional VKS
type: application
version: 0.10.0
appVersion: "0.10.0"
dependencies:
  - name: virtfoundry-operator
    version: 0.10.0
    repository: file://../virtfoundry-operator
    alias: operator
    condition: operator.enabled
  - name: virtfoundry
    version: 0.10.0
    repository: file://../virtfoundry
    alias: core
    condition: core.enabled
  - name: virtfoundry-vks
    version: 0.10.0
    repository: oci://ghcr.io/virtfoundry/charts
    alias: vks
    condition: vks.enabled
