{{- if .Values.platform.networking.bridge.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Values.fullnamePrefix }}-bridge-setup
  namespace: {{ .Values.platform.networking.bridge.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.fullnamePrefix }}-bridge-setup
    {{- include "virtforge.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.fullnamePrefix }}-bridge-setup
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.fullnamePrefix }}-bridge-setup
    spec:
      hostNetwork: true
      hostPID: true
      tolerations:
        - operator: Exists
      initContainers:
        - name: setup-bridge
          image: alpine:3.21
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - |
              set -e
              BR="{{ .Values.platform.networking.bridge.name }}"
              ip link show "$BR" >/dev/null 2>&1 || ip link add "$BR" type bridge
              ip link set "$BR" up
              echo "$BR ready on $(hostname)"
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
{{- end }}
