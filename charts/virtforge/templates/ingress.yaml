{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.fullnamePrefix }}
  namespace: {{ .Values.namespace }}
  annotations:
    {{- range $k, $v := .Values.ingress.annotations }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.fullnamePrefix }}-api
                port:
                  number: {{ .Values.api.service.port }}
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.fullnamePrefix }}-api
                port:
                  number: {{ .Values.api.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.fullnamePrefix }}-ui
                port:
                  number: {{ .Values.ui.service.port }}
{{- end }}
