{{- if .Values.platform.multus.install }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.fullnamePrefix }}-multus-install
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "virtforge.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: {{ .Values.fullnamePrefix }}-platform
      restartPolicy: OnFailure
      containers:
        - name: install
          image: registry.k8s.io/kubectl:v1.35.4
          command:
            - /bin/sh
            - -ec
            - |
              if kubectl get ds -n kube-system kube-multus-ds >/dev/null 2>&1; then
                echo "Multus already installed"
                exit 0
              fi
              kubectl apply -f "{{ .Values.platform.multus.manifestUrl }}"
              kubectl -n kube-system rollout status daemonset/kube-multus-ds --timeout=300s
{{- end }}
