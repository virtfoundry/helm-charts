# VirtForge Cloud control plane
#
# Deploy with Gateway API HTTPRoute (Traefik homelab-gateway example).
# Prerequisites: Gateway API CRDs, Gateway controller, parent Gateway resource.
#
# Homelab: make deploy-homelab  (or helm -f values-homelab.yaml)

images:
  api: ghcr.io/virtforge-cloud/iaas-api:latest
  worker: ghcr.io/virtforge-cloud/iaas-api:latest
  ui: ghcr.io/virtforge-cloud/iaas-ui:latest
  pullPolicy: IfNotPresent
  # Uncomment if GHCR packages are private:
  # pullSecrets:
  #   - ghcr-credentials

ingress:
  enabled: false

gateway:
  enabled: true
  parentRefs:
    - name: homelab-gateway
      namespace: traefik
      sectionName: web
  hostnames:
    - virtforge-cloud.homelab

ui:
  service:
    type: ClusterIP
    port: 80

platform:
  multus:
    install: false  # use: make setup-multus (or INSTALL_MULTUS=true on deploy)
  networking:
    public:
      enabled: true
      cidr: 10.0.50.0/24
      gateway: 10.0.50.254
      dns:
        - 10.0.50.254
      ipPool:
        start: 10.0.50.10
        end: 10.0.50.99
      reservedRanges:
        - start: 10.0.50.100
          end: 10.0.50.150
          reason: metallb-loadbalancer
      bridge:
        name: virtforge-pub0
        uplink: enp3s0.50
      nad:
        name: virtforge-public
        namespace: virtforge-system
    isolated:
      enabled: true
      bridge:
        name: virtforge-br0
    vm:
      defaultNetwork: public
      allowPodNetwork: false
    bridge:
      namespace: kube-system
  kubevirt:
    featureGates:
      enabled: false  # enable after: make setup-kubevirt
  cdi:
    install: false
