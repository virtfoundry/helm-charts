# Default values for VirtForge Cloud.
# Installs API, worker, UI, and optional embedded MySQL.

nameOverride: ""
fullnamePrefix: virtforge

namespace: virtforge-system

images:
  api: ghcr.io/virtforge-cloud/iaas-api:0.2.0
  worker: ghcr.io/virtforge-cloud/iaas-api:0.2.0
  ui: ghcr.io/virtforge-cloud/iaas-ui:0.2.0
  pullPolicy: IfNotPresent

mysql:
  enabled: true
  image: mysql:8.0
  storage: 5Gi
  auth:
    rootPassword: virtforge-root
    database: virtforge
    user: virtforge
    password: virtforge

secrets:
  rootPassword: virtforge
  jwtSecret: change-me-in-production

config:
  logLevel: info
  jwtExpire: 86400
  kubevirtEnabled: true

ingress:
  enabled: true
  className: nginx
  host: iaas.local
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

# Gateway API HTTPRoute (mutually exclusive with ingress.enabled)
gateway:
  enabled: false
  parentRefs:
    - name: homelab-gateway
      namespace: traefik
      sectionName: web
  hostnames:
    - iaas.local

ui:
  service:
    type: ClusterIP
    port: 80
    nodePort: 30880

api:
  service:
    type: ClusterIP
    port: 8080
  replicas: 1

worker:
  replicas: 1

# Optional cluster/platform bootstrap (homelab / bare-metal without a registry).
# Image sideloading stays outside the chart — see scripts/deploy/homelab.sh.
platform:
  multus:
    # Install Multus thick plugin from upstream manifest when absent.
    install: false
    manifestUrl: https://raw.githubusercontent.com/k8snetworkplumbingwg/multus-cni/master/deployments/multus-daemonset-thick.yml
  networking:
    # Public/shared network for tenant VMs (Multus bridge or macvlan — configured per site).
    public:
      enabled: false
      mode: bridge                    # bridge | macvlan
      cidr: 10.0.50.0/24
      gateway: 10.0.50.254
      dns:
        - 10.0.50.254
      ipPool:
        start: 10.0.50.10
        end: 10.0.50.99
      reservedRanges:
        - start: 10.0.50.100
          end: 10.0.50.150
          reason: metallb-loadbalancer
      bridge:
        name: virtforge-pub0
        uplink: ""                    # e.g. enp3s0.50 on homelab workers
        address: ""                   # optional bridge IPv4 for dnsmasq (outside VM pool)
      macvlan:
        master: ""
        mode: bridge
      nad:
        name: virtforge-public
        namespace: virtforge-system
    # Private tenant VPC networks (isolated L2 on internal bridge).
    isolated:
      enabled: true
      bridge:
        name: virtforge-br0
    # Default VM networking when no network_ids are set on deploy.
    vm:
      defaultNetwork: pod             # pod | public
      allowPodNetwork: true           # false = Multus-only when public network is used
    bridge:
      namespace: kube-system          # DaemonSet namespace for bridge setup
  storage:
    defaultClass: local-path       # any cluster StorageClass: longhorn, ceph-rbd, nfs-client, …
    windowsBootSizeGi: 32
    windowsISOSizeGi: 8
  kubevirt:
    featureGates:
      enabled: false
      gates:
        - Snapshot
        - VideoConfig
  cdi:
    install: false
    version: ""  # empty = latest from GitHub releases API at install time
