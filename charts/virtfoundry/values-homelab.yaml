# VirtFoundry control plane
#
# Deploy with Gateway API HTTPRoute (Traefik homelab-gateway example).
# Prerequisites: Gateway API CRDs, Gateway controller, parent Gateway resource.
#
# Homelab: make deploy-homelab  (or helm -f values-homelab.yaml)

images:
  api: ghcr.io/virtfoundry/core:latest
  worker: ghcr.io/virtfoundry/core:latest
  ui: ghcr.io/virtfoundry/ui:latest
  pullPolicy: IfNotPresent
  # Uncomment if GHCR packages are private:
  # pullSecrets:
  #   - ghcr-credentials

ingress:
  enabled: false

gateway:
  enabled: true
  parentRefs:
    - name: homelab-gateway
      namespace: traefik
      sectionName: web
  hostnames:
    - virtfoundry.homelab

ui:
  service:
    type: ClusterIP
    port: 80

platform:
  multus:
    install: false  # use: make setup-multus (or INSTALL_MULTUS=true on deploy)
  networking:
    public:
      enabled: true
      cidr: 10.0.50.0/24
      gateway: 10.0.50.1
      dns:
        - 10.0.50.1
      ipPool:
        start: 10.0.50.10
        end: 10.0.50.99
      reservedRanges:
        - start: 10.0.50.100
          end: 10.0.50.150
          reason: metallb-loadbalancer
      bridge:
        name: virtfoundry-pub0
        uplink: enp3s0.50
        address: 10.0.50.2/24   # bridge IP for dnsmasq; outside VM pool (.10-.99)
        # cloudbr0 also has 10.0.50.1/24 on homelab — steer VM pool (.10-.99) via virtfoundry-pub0
        routePoolViaBridge:
          - 10.0.50.0/28
          - 10.0.50.16/28
          - 10.0.50.32/27
          - 10.0.50.64/27
          - 10.0.50.96/30
      nad:
        name: virtfoundry-public
        namespace: virtfoundry-system
    isolated:
      enabled: true
      bridge:
        name: virtfoundry-br0
    vm:
      defaultNetwork: pod
      allowPodNetwork: true   # pod masquerade for sandbox; public IP on secondary macvlan NIC
    bridge:
      namespace: kube-system
  storage:
    defaultClass: local-path
    windowsBootSizeGi: 32
    windowsISOSizeGi: 8
  kubevirt:
    featureGates:
      enabled: false  # enable after: make setup-kubevirt
  cdi:
    install: false  # installed via scripts/setup/cdi.sh
