{{- if .Values.ingress.enabled }}
{{- if and (not .Values.ingress.tls) (not .Values.ingress.allowCleartext) }}
{{- fail "ingress.enabled requires ingress.tls (secretName + hosts) or ingress.allowCleartext=true. Cleartext HTTP is not the default — see docs/guide/configuration.md#ingress-and-tls" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.fullnamePrefix }}
  namespace: {{ .Values.namespace }}
  annotations:
    {{- range $k, $v := .Values.ingress.annotations }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.fullnamePrefix }}-api
                port:
                  number: {{ .Values.api.service.port }}
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.fullnamePrefix }}-api
                port:
                  number: {{ .Values.api.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.fullnamePrefix }}-ui
                port:
                  number: {{ .Values.ui.service.port }}
{{- end }}
