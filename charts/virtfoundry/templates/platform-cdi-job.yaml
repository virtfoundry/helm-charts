{{- if .Values.platform.cdi.install }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.fullnamePrefix }}-cdi-install
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "virtfoundry.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: {{ .Values.fullnamePrefix }}-platform-cdi
      restartPolicy: OnFailure
      containers:
        - name: install
          image: registry.k8s.io/kubectl:v1.35.4
          command:
            - /bin/sh
            - -ec
            - |
              if kubectl get cdi cdi -n cdi >/dev/null 2>&1; then
                echo "CDI already installed"
                exit 0
              fi
              VERSION="{{ .Values.platform.cdi.version }}"
              if [ -z "$VERSION" ]; then
                echo "platform.cdi.version is required when platform.cdi.install=true (do not use releases/latest)"
                exit 1
              fi
              echo "Installing CDI $VERSION"
              kubectl apply -f "https://github.com/kubevirt/containerized-data-importer/releases/download/${VERSION}/cdi-operator.yaml"
              kubectl apply -f "https://github.com/kubevirt/containerized-data-importer/releases/download/${VERSION}/cdi-cr.yaml"
              kubectl -n cdi wait --for=condition=Available cdi/cdi --timeout=300s
              kubectl -n cdi rollout status deployment/cdi-deployment --timeout=300s
{{- end }}
