{{- $multi := gt (int .Values.api.replicas) 1 }}
{{- if and $multi (not (.Values.api.multiReplica | default dict).enabled) }}
{{- fail "api.replicas > 1 requires api.multiReplica.enabled=true: the audit log, async jobs, login throttle and console ticket single use are still per pod. See api.multiReplica in values.yaml." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.fullnamePrefix }}-api
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.fullnamePrefix }}-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.fullnamePrefix }}-api
  template:
    metadata:
      annotations:
        # The API reads its config file at start: roll the pod when the ConfigMap changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app: {{ .Values.fullnamePrefix }}-api
    spec:
      {{- include "virtfoundry.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ .Values.fullnamePrefix }}-api
      {{- if $multi }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: {{ .Values.fullnamePrefix }}-api
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.api.securityContext.runAsUser | default 65532 }}
        runAsGroup: {{ .Values.api.securityContext.runAsGroup | default 65532 }}
        fsGroup: {{ .Values.api.securityContext.fsGroup | default 65532 }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: {{ .Values.images.api }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          {{- if $multi }}
          # Keep serving while the Service drops this endpoint, before SIGTERM.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          {{- end }}
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONFIG_PATH
              value: /etc/virtfoundry/config.yaml
            - name: ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "virtfoundry.secretName" . }}
                  key: {{ include "virtfoundry.rootPasswordKey" . }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "virtfoundry.secretName" . }}
                  key: {{ include "virtfoundry.jwtSecretKey" . }}
            {{- if .Values.secrets.allowInsecureDefaults }}
            - name: VF_ALLOW_INSECURE_DEFAULTS
              value: "1"
            {{- end }}
            - name: VIRTFOUNDRY_STORE
              value: {{ .Values.store.driver | quote }}
          volumeMounts:
            - name: config
              mountPath: /etc/virtfoundry
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Values.fullnamePrefix }}-config
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.fullnamePrefix }}-api
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: {{ .Values.fullnamePrefix }}-api
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: 8080
      name: http
{{- if $multi }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Values.fullnamePrefix }}-api
  namespace: {{ .Values.namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: {{ .Values.fullnamePrefix }}-api
{{- end }}
