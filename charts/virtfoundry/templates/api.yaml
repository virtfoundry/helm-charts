apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.fullnamePrefix }}-api
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.fullnamePrefix }}-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.fullnamePrefix }}-api
  template:
    metadata:
      labels:
        app: {{ .Values.fullnamePrefix }}-api
    spec:
      {{- include "virtfoundry.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ .Values.fullnamePrefix }}-api
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.api.securityContext.runAsUser | default 65532 }}
        runAsGroup: {{ .Values.api.securityContext.runAsGroup | default 65532 }}
        fsGroup: {{ .Values.api.securityContext.fsGroup | default 65532 }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: {{ .Values.images.api }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONFIG_PATH
              value: /etc/virtfoundry/config.yaml
            - name: ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "virtfoundry.secretName" . }}
                  key: {{ include "virtfoundry.rootPasswordKey" . }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "virtfoundry.secretName" . }}
                  key: {{ include "virtfoundry.jwtSecretKey" . }}
            {{- if .Values.secrets.allowInsecureDefaults }}
            - name: VF_ALLOW_INSECURE_DEFAULTS
              value: "1"
            {{- end }}
            - name: VIRTFOUNDRY_STORE
              value: {{ .Values.store.driver | quote }}
          volumeMounts:
            - name: config
              mountPath: /etc/virtfoundry
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Values.fullnamePrefix }}-config
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.fullnamePrefix }}-api
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: {{ .Values.fullnamePrefix }}-api
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: 8080
      name: http
