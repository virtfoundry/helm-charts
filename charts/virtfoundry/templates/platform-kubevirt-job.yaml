{{- $ratio := int (.Values.platform.kubevirt.cpuAllocationRatio | default 0) }}
{{- $gates := .Values.platform.kubevirt.featureGates.enabled }}
{{- if or $gates (gt $ratio 0) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.namePrefix }}-kubevirt-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "virtfoundry.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: {{ .Values.namePrefix }}-platform
      restartPolicy: OnFailure
      containers:
        # registry.k8s.io/kubectl is distroless: no shell, binary at /bin/kubectl.
        - name: patch
          image: registry.k8s.io/kubectl:v1.35.4
          command:
            - /bin/kubectl
            - patch
            - kubevirt
            - kubevirt
            - -n
            - kubevirt
            - --type=merge
            - -p
            - >-
              {"spec":{"configuration":{"developerConfiguration":{
              {{- if $gates -}}
              "featureGates":{{ .Values.platform.kubevirt.featureGates.gates | toJson }}
              {{- if gt $ratio 0 -}},{{- end -}}
              {{- end -}}
              {{- if gt $ratio 0 -}}
              "cpuAllocationRatio":{{ $ratio }}
              {{- end -}}
              }}}}
{{- end }}
