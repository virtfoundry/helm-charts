# Example overlay — kind (laptop, no VLAN)
# Default public network is off. VMs use the pod network; UI NodePort 30880
# maps to host 8080. Walkthrough: docs/guide/kind.md
# Do not set public.bridge.uplink to eth0 (Kubernetes node NIC in the container).

ingress:
  enabled: false

gateway:
  enabled: false

ui:
  service:
    type: NodePort
    port: 80
    nodePort: 30880

# kind kubelets use self-signed serving certs and resolve by hostname
# differently than production clusters, so the metrics-server subchart
# (installed by the parent chart) needs both flags below to scrape
# them. Production clusters with a real kubelet CA chain should leave
# args empty.
#
#   --kubelet-insecure-tls              # accept self-signed kubelet certs
#   --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
#                                       # resolve nodes by IP, not by a
#                                       # hostname the in-Docker DNS won't see
metrics-server:
  args:
    - --kubelet-insecure-tls
    - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname

platform:
  networking:
    public:
      enabled: false
    isolated:
      enabled: true
      bridge:
        name: virtfoundry-br0
    vm:
      defaultNetwork: pod
      allowPodNetwork: true
    bridge:
      # kind control-plane is tainted NoSchedule; bridges must still run there.
      tolerations:
        - operator: Exists
  storage:
    defaultClass: standard
    snapshotClass: ""
