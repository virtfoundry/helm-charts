# Example overlay — kind (laptop, no VLAN)
# Default public network is off. VMs use the pod network; UI NodePort 30880
# maps to host 8080. Walkthrough: docs/guide/kind.md
# Do not set public.bridge.uplink to eth0 (Kubernetes node NIC in the container).

ingress:
  enabled: false

gateway:
  enabled: false

ui:
  service:
    type: NodePort
    port: 80
    nodePort: 30880

# The metrics-server subchart is opt-in (chart default is `enabled: false`)
# and this overlay turns it on: kind kubelets use self-signed serving certs,
# so the upstream default `--kubelet-preferred-address-types` still applies
# and only --kubelet-insecure-tls is needed. Production clusters with a real
# kubelet CA chain leave this off.
metrics-server:
  enabled: true
  args:
    - --kubelet-insecure-tls

platform:
  networking:
    public:
      enabled: false
    isolated:
      enabled: true
      bridge:
        name: virtfoundry-br0
    vm:
      defaultNetwork: pod
      allowPodNetwork: true
    bridge:
      # kind control-plane is tainted NoSchedule; bridges must still run there.
      tolerations:
        - operator: Exists
  storage:
    defaultClass: standard
    snapshotClass: ""
