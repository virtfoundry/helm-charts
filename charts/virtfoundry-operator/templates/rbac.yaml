apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "virtfoundry-operator.fullname" . }}
  labels:
    {{- include "virtfoundry-operator.labels" . | nindent 4 }}
# Keep in sync with kubebuilder markers on TenantReconciler / InstanceReconciler
# and config/rbac/role.yaml (make manifests). Add permissions per controller when it lands.
rules:
  - apiGroups: ["virtfoundry.io"]
    resources: ["tenants"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["virtfoundry.io"]
    resources: ["tenants/status", "instances/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["virtfoundry.io"]
    resources: ["tenants/finalizers", "instances/finalizers"]
    verbs: ["update"]
  - apiGroups: ["virtfoundry.io"]
    resources: ["instances"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["virtfoundry.io"]
    resources: ["offerings", "templates"]
    verbs: ["get", "list", "watch"]
  # Tenant namespaces are named virtfoundry-tenant-{slug}, so resourceNames
  # cannot scope these verbs (no prefix matching, and namespaces are cluster
  # scoped). Deletion is constrained by the operator's ownership guard and by
  # the ValidatingAdmissionPolicy in namespace-guard.yaml.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  # No secrets: no controller reads or writes Secrets. If one ever needs to,
  # grant a Role in {{ .Values.namespace }} instead of a ClusterRole.
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "virtfoundry-operator.fullname" . }}
  labels:
    {{- include "virtfoundry-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "virtfoundry-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "virtfoundry-operator.fullname" . }}
    namespace: {{ .Values.namespace }}
{{- if .Values.leaderElection }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "virtfoundry-operator.fullname" . }}-leader-election
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "virtfoundry-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "virtfoundry-operator.fullname" . }}-leader-election
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "virtfoundry-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "virtfoundry-operator.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "virtfoundry-operator.fullname" . }}
    namespace: {{ .Values.namespace }}
{{- end }}
