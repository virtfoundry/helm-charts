{{- if and .Values.kubevirtGuard.enabled (.Capabilities.APIVersions.Has "admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy") }}
{{- /*
  Cluster-side guard for KubeVirt mutate (issue #28 slice).

  Operator ClusterRole still grants cluster-wide VM/VMI verbs so
  controller-runtime informers and Tenant-driven Role bootstrap stay
  possible (RBAC privilege-escalation rules block the operator from
  creating a Role that grants mutate rights it does not already hold).
  This VAP denies the operator ServiceAccount CREATE/UPDATE/DELETE on
  VirtualMachines and VirtualMachineInstances outside virtfoundry-tenant-*.

  Residual: true Role/RoleBinding least privilege needs a privileged
  installer bootstrap or a dual ServiceAccount split — tracked on #28.
*/ -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "virtfoundry-operator.fullname" . }}-kubevirt-guard
  labels:
    {{- include "virtfoundry-operator.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["kubevirt.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["virtualmachines", "virtualmachineinstances"]
  matchConditions:
    # Only the operator ServiceAccount is constrained; humans and other
    # controllers keep whatever their own RBAC allows.
    - name: operator-service-account-only
      expression: >-
        request.userInfo.username ==
        'system:serviceaccount:{{ .Values.namespace }}:{{ include "virtfoundry-operator.fullname" . }}'
  validations:
    - expression: >-
        request.namespace.startsWith('virtfoundry-tenant-') &&
        request.namespace != 'virtfoundry-tenant-'
      message: virtfoundry-operator may only mutate VirtualMachines/VMIs in virtfoundry-tenant-* namespaces
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "virtfoundry-operator.fullname" . }}-kubevirt-guard
  labels:
    {{- include "virtfoundry-operator.labels" . | nindent 4 }}
spec:
  policyName: {{ include "virtfoundry-operator.fullname" . }}-kubevirt-guard
  validationActions: ["Deny"]
{{- end }}
