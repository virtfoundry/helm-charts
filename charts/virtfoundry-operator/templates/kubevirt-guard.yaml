{{- if and .Values.kubevirtGuard.enabled (.Capabilities.APIVersions.Has "admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy") }}
{{- /*
  Cluster-side guard for KubeVirt mutate (issue #28).

  RBAC split: manager ClusterRole is monitor-only (get/list/watch) on
  VirtualMachines/VMIs; mutate lives in *-kubevirt-mutate and is granted
  per tenant via RoleBinding. This VAP is defense-in-depth if a stolen SA
  mints RoleBindings outside virtfoundry-tenant-* (bind + rolebindings
  create remain cluster-scoped — residual on #28).
*/ -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "virtfoundry-operator.fullname" . }}-kubevirt-guard
  labels:
    {{- include "virtfoundry-operator.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["kubevirt.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["virtualmachines", "virtualmachineinstances"]
  matchConditions:
    # Only the operator ServiceAccount is constrained; humans and other
    # controllers keep whatever their own RBAC allows.
    - name: operator-service-account-only
      expression: >-
        request.userInfo.username ==
        'system:serviceaccount:{{ .Values.namespace }}:{{ include "virtfoundry-operator.fullname" . }}'
  validations:
    - expression: >-
        request.namespace.startsWith('virtfoundry-tenant-') &&
        request.namespace != 'virtfoundry-tenant-'
      message: virtfoundry-operator may only mutate VirtualMachines/VMIs in virtfoundry-tenant-* namespaces
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "virtfoundry-operator.fullname" . }}-kubevirt-guard
  labels:
    {{- include "virtfoundry-operator.labels" . | nindent 4 }}
spec:
  policyName: {{ include "virtfoundry-operator.fullname" . }}-kubevirt-guard
  validationActions: ["Deny"]
{{- end }}
