apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "virtfoundry-operator.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "virtfoundry-operator.labels" . | nindent 4 }}
    control-plane: controller-manager
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "virtfoundry-operator.name" . }}
      control-plane: controller-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "virtfoundry-operator.name" . }}
        app.kubernetes.io/part-of: virtfoundry
        control-plane: controller-manager
    spec:
      serviceAccountName: {{ include "virtfoundry-operator.fullname" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ include "virtfoundry-operator.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /manager
          args:
            {{- if .Values.leaderElection }}
            - --leader-elect
            {{- end }}
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=0
          env:
            - name: VIRTFOUNDRY_OPERATOR_SERVICE_ACCOUNT
              value: {{ include "virtfoundry-operator.fullname" . | quote }}
            - name: VIRTFOUNDRY_OPERATOR_NAMESPACE
              value: {{ .Values.namespace | quote }}
            - name: VIRTFOUNDRY_KUBEVIRT_MUTATE_CLUSTERROLE
              value: {{ printf "%s-kubevirt-mutate" (include "virtfoundry-operator.fullname" .) | quote }}
            {{- with .Values.imageAllowlist.prefixes }}
            - name: VIRTFOUNDRY_ALLOWED_CONTAINER_IMAGE_PREFIXES
              value: {{ . | join "," | quote }}
            {{- end }}
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      terminationGracePeriodSeconds: 10
