name: Chart lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint ./charts/virtfoundry

      - name: Render default values
        run: helm template virtfoundry ./charts/virtfoundry

      - name: Render gateway profile
        run: helm template virtfoundry ./charts/virtfoundry -f ./charts/virtfoundry/values-gateway.yaml

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install -r requirements-docs.txt

      - name: MkDocs build (strict)
        run: mkdocs build --strict
