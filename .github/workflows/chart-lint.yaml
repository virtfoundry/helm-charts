name: Chart lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      # Throwaway render-only credentials. The chart refuses to render without them;
      # these only satisfy the length rules and never reach a cluster.
      CI_ROOT_PASSWORD: ci-render-only-password
      CI_JWT_SECRET: ci-render-only-jwt-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Add subchart repos
        # *.tgz subchart tarballs are gitignored, so the CI runner has to
        # download them from the upstream chart repos before lint/template.
        # Required as long as the chart declares `dependencies:`.
        run: |
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server
          helm repo update

      - name: Helm dependency build (virtfoundry)
        run: helm dependency build ./charts/virtfoundry

      - name: Helm lint
        run: helm lint ./charts/virtfoundry --set-string secrets.rootPassword="$CI_ROOT_PASSWORD" --set-string secrets.jwtSecret="$CI_JWT_SECRET"

      - name: Helm lint (operator chart)
        run: helm lint ./charts/virtfoundry-operator

      - name: Reject sentinel credentials (must fail)
        run: ./scripts/ci/assert-secrets-fail-closed.sh

      - name: UI nginx keeps the port in the Host header (WebSocket origin check)
        run: ./scripts/ci/assert-ui-nginx-host.sh

      - name: Render default values
        run: helm template virtfoundry ./charts/virtfoundry --set-string secrets.rootPassword="$CI_ROOT_PASSWORD" --set-string secrets.jwtSecret="$CI_JWT_SECRET"

      - name: Render with existingSecret
        run: helm template virtfoundry ./charts/virtfoundry --set secrets.existingSecret=virtfoundry-credentials

      - name: Render gateway profile
        run: helm template virtfoundry ./charts/virtfoundry -f ./charts/virtfoundry/values-gateway.yaml --set-string secrets.rootPassword="$CI_ROOT_PASSWORD" --set-string secrets.jwtSecret="$CI_JWT_SECRET"

      - name: Render ingress TLS profile
        run: helm template virtfoundry ./charts/virtfoundry -f ./charts/virtfoundry/values-ingress-tls.yaml --set-string secrets.rootPassword="$CI_ROOT_PASSWORD" --set-string secrets.jwtSecret="$CI_JWT_SECRET"

      - name: Reject cleartext Ingress (must fail)
        run: |
          if helm template virtfoundry ./charts/virtfoundry \
            --set ingress.enabled=true \
            --set-string secrets.rootPassword="$CI_ROOT_PASSWORD" \
            --set-string secrets.jwtSecret="$CI_JWT_SECRET" >/dev/null 2>&1; then
            echo "expected fail: ingress.enabled without tls"
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Security gates (#37 secrets, #38 platform RBAC)
        run: bash ./scripts/ci/security-gates.sh

      # The chart lives here; the RBAC check lives in the operator repository, next to the
      # ClusterRole generated from the kubebuilder markers.
      - name: Checkout operator (RBAC check)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: virtfoundry/operator
          path: .operator
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .operator/go.mod
          cache-dependency-path: .operator/go.sum

      - name: Operator chart RBAC gate (#43 least privilege, matches the controllers)
        run: OPERATOR_DIR=.operator bash ./scripts/ci/verify-operator-chart-rbac.sh

      - name: Install MkDocs
        run: pip install -r requirements-docs.txt

      # PyYAML comes from requirements-docs.txt (installed above).
      - name: API RBAC contract gate (core docs/rbac-contract.yaml)
        run: bash ./scripts/ci/verify-api-rbac-contract.sh

      - name: CRD chart gate (matches operator/vks, keeps CRDs on uninstall)
        run: bash ./scripts/ci/verify-crds-chart.sh

      - name: Platform umbrella parity gate (same resources as the standalone charts)
        run: bash ./scripts/ci/verify-platform-parity.sh

      - name: MkDocs build (strict)
        run: mkdocs build --strict
