name: Chart e2e

# Installs the charts on a throwaway Kind cluster and checks the CRD flow:
# fresh install, umbrella install, migration from the 0.10.x operator chart, and the quickstart.
# The quickstart scenario runs the commands of docs/guide/quickstart.md and waits for the control
# plane, health check and root login. There is no KubeVirt, so no scenario deploys a VM.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "charts/**"
      - "docs/guide/quickstart.md"
      - "scripts/ci/e2e-charts.sh"
      - ".github/workflows/chart-e2e.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chart-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: [fresh, umbrella, migrate, quickstart]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Create Kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: chart-e2e

      - name: Run ${{ matrix.scenario }}
        run: bash ./scripts/ci/e2e-charts.sh ${{ matrix.scenario }}
